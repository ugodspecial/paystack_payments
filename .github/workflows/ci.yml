name: CI

on:
  push:
    branches: [main, develop, version-15, version-16]
  pull_request:
    branches: [main, develop]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install ruff
      - run: ruff check paystack_payments/

  test:
    runs-on: ubuntu-latest
    needs: lint
    strategy:
      matrix:
        frappe-branch: [version-15, version-16]
    steps:
      - uses: actions/checkout@v4
      - uses: frappe/frappe-ui-actions/setup-frappe@main
        with:
          branch: ${{ matrix.frappe-branch }}
          apps: |
            payments
            paystack_payments .
      - name: Run tests
        run: |
          cd ~/frappe-bench
          bench --site test.localhost run-tests --app paystack_payments
